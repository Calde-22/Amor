<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para ti — con cariño</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --rosa-pastel: #ffd6e7;
      --rosa-claro: #ffc0d9;
      --blanco-suave: #fff7fb;
      --dorado-rosa: #e8b4b8;
      --dorado-brillo: rgba(232, 180, 184, 0.45);
      --sombra: rgba(199, 120, 150, 0.22);
      --texto: #6b4a5a;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: "Cormorant Garamond", Georgia, serif;
      color: var(--texto);
      background: linear-gradient(
        145deg,
        #fff7fb 0%,
        #ffe8f2 25%,
        #ffd6e7 50%,
        #ffeef6 75%,
        #fff7fb 100%
      );
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(1rem, 4vw, 2.5rem);
    }

    /* Brillos sutiles en el fondo */
    .bg-shimmer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 20%, rgba(255, 255, 255, 0.65) 0%, transparent 50%),
        radial-gradient(ellipse 60% 40% at 85% 75%, rgba(255, 214, 231, 0.5) 0%, transparent 45%),
        radial-gradient(circle at 50% 100%, rgba(255, 192, 217, 0.35) 0%, transparent 55%);
      animation: bgPulse 12s ease-in-out infinite alternate;
    }

    @keyframes bgPulse {
      from { opacity: 0.85; transform: scale(1); }
      to { opacity: 1; transform: scale(1.02); }
    }

    .sparkle-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .sparkle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: linear-gradient(135deg, #fff, var(--dorado-rosa));
      box-shadow: 0 0 8px 2px rgba(255, 255, 255, 0.8);
      opacity: 0;
      animation: sparkleFloat 4s ease-in-out infinite;
    }

    @keyframes sparkleFloat {
      0%, 100% { opacity: 0; transform: translateY(0) scale(0.4); }
      30% { opacity: 0.9; transform: translateY(-12px) scale(1); }
      60% { opacity: 0.4; transform: translateY(-24px) scale(0.7); }
    }

    .hearts-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      font-size: clamp(10px, 2vw, 18px);
      color: rgba(255, 150, 180, 0.35);
      text-shadow: 0 0 12px rgba(255, 200, 220, 0.5);
      animation: heartRise linear infinite;
      bottom: -5%;
    }

    @keyframes heartRise {
      0% {
        transform: translateY(0) translateX(0) rotate(0deg) scale(1);
        opacity: 0;
      }
      8% { opacity: 0.7; }
      92% { opacity: 0.5; }
      100% {
        transform: translateY(-110vh) translateX(var(--drift)) rotate(360deg) scale(0.6);
        opacity: 0;
      }
    }

    .hint {
      position: fixed;
      bottom: clamp(0.75rem, 3vw, 1.25rem);
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      font-size: 0.9rem;
      opacity: 0.65;
      letter-spacing: 0.04em;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    body.modal-open {
      overflow: hidden;
      overscroll-behavior: none;
    }

    /* Modal carta — foco pantalla completa */
    .letter-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(12px, env(safe-area-inset-top, 0px))
        max(12px, env(safe-area-inset-right, 0px))
        max(12px, env(safe-area-inset-bottom, 0px))
        max(12px, env(safe-area-inset-left, 0px));
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.5s ease, visibility 0s linear 0.5s;
    }

    .letter-modal[hidden] {
      display: none !important;
    }

    .letter-modal.is-open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 0.5s ease, visibility 0s linear 0s;
    }

    .letter-modal__backdrop {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: rgba(28, 12, 22, 0.68);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
    }

    .letter-modal__close {
      position: absolute;
      top: max(10px, env(safe-area-inset-top, 0px));
      right: max(10px, env(safe-area-inset-right, 0px));
      z-index: 3;
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.5rem;
      line-height: 1;
      color: #f5e6ee;
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      transition: transform 0.25s ease, background 0.25s ease;
    }

    .letter-modal__close:hover {
      background: rgba(255, 255, 255, 0.22);
      transform: scale(1.06);
    }

    .letter-modal__panel {
      position: relative;
      z-index: 1;
      width: min(94vw, 480px);
      max-height: min(90dvh, 90vh);
      display: flex;
      flex-direction: column;
      min-height: 0;
      transform: scale(0.94) translateY(16px);
      opacity: 0;
      transition: transform 0.55s cubic-bezier(0.34, 1.2, 0.64, 1), opacity 0.45s ease;
    }

    .letter-modal.is-open .letter-modal__panel {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    .letter-modal .letter {
      position: relative;
      width: 100%;
      min-height: 0;
      max-height: min(86dvh, 86vh, 820px);
      margin: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      opacity: 1;
      visibility: visible;
      transform: none;
      pointer-events: auto;
      border-radius: 18px;
      box-shadow:
        0 4px 0 rgba(255, 255, 255, 0.55) inset,
        0 28px 80px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(255, 255, 255, 0.12);
      scrollbar-color: rgba(232, 180, 184, 0.55) rgba(255, 247, 251, 0.35);
      scrollbar-width: thin;
    }

    .hint.hidden {
      opacity: 0;
    }

    /* Escena central */
    .stage {
      position: relative;
      z-index: 10;
      perspective: 1200px;
      perspective-origin: 50% 40%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: min(70vh, 520px);
      width: 100%;
      max-width: min(96vw, 440px);
      overflow: visible;
    }

    .envelope-wrap {
      position: relative;
      width: 100%;
      height: 180px;
      transform-style: preserve-3d;
      overflow: visible;
      cursor: pointer;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      animation: envelopeEnter 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      opacity: 0;
    }

    @keyframes envelopeEnter {
      from {
        opacity: 0;
        transform: translateY(28px) scale(0.92) rotateX(8deg);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1) rotateX(0deg);
      }
    }

    .envelope-wrap:not(.opened):hover {
      transform: translateY(-6px) scale(1.03);
    }

    .envelope-wrap:not(.opened):active {
      transform: translateY(-2px) scale(0.99);
    }

    .envelope-wrap.opened {
      cursor: default;
      pointer-events: auto;
    }

    .envelope-wrap.opened:hover {
      transform: none;
    }

    /* Cuerpo del sobre */
    .env-back {
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, var(--rosa-claro) 0%, var(--rosa-pastel) 45%, #ffb8d4 100%);
      border-radius: 6px;
      box-shadow:
        0 18px 40px var(--sombra),
        inset 0 1px 0 rgba(255, 255, 255, 0.45);
    }

    .env-inner-shadow {
      position: absolute;
      inset: 8px 10px 22px;
      border-radius: 4px;
      background: linear-gradient(180deg, rgba(107, 74, 90, 0.06) 0%, transparent 40%);
      pointer-events: none;
    }

    /* Solapa triangular */
    .env-flap {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 52%;
      transform-origin: 50% 0%;
      transform-style: preserve-3d;
      transition: transform 1.15s cubic-bezier(0.42, 0, 0.2, 1);
      z-index: 7;
      filter: drop-shadow(0 -2px 6px rgba(199, 120, 150, 0.15));
      backface-visibility: hidden;
    }

    .env-flap-inner {
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #ffe0ec 0%, var(--rosa-claro) 55%, #ff9ec4 100%);
      clip-path: polygon(0 0, 50% 100%, 100% 0);
      border-radius: 6px 6px 0 0;
      box-shadow: inset 0 -8px 16px rgba(255, 255, 255, 0.25);
      backface-visibility: hidden;
    }

    .envelope-wrap.is-opening .env-flap,
    .envelope-wrap.opened .env-flap {
      transform: rotateX(-178deg) translateZ(-40px);
    }

    /* Frente / bolsillo */
    .env-front {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 58%;
      background: linear-gradient(180deg, #ffc8dd 0%, var(--rosa-pastel) 100%);
      clip-path: polygon(0 0, 50% 45%, 100% 0, 100% 100%, 0 100%);
      border-radius: 0 0 6px 6px;
      z-index: 5;
      box-shadow:
        inset 0 8px 20px rgba(255, 255, 255, 0.35),
        0 8px 24px rgba(199, 120, 150, 0.12);
    }

    .env-lip {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 28%;
      background: linear-gradient(0deg, #ffb3d0 0%, var(--rosa-claro) 100%);
      clip-path: polygon(0 100%, 50% 0, 100% 100%);
      z-index: 6;
      opacity: 0.95;
      box-shadow: 0 -4px 12px rgba(199, 120, 150, 0.1);
    }

    /* Sello / corazón */
    .seal {
      position: absolute;
      left: 50%;
      top: 38%;
      transform: translate(-50%, -50%);
      z-index: 8;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff7fb, var(--dorado-rosa));
      border: 2px solid rgba(255, 255, 255, 0.65);
      box-shadow:
        0 6px 18px var(--sombra),
        inset 0 -2px 8px rgba(199, 120, 150, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .envelope-wrap.is-opening .seal,
    .envelope-wrap.opened .seal {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.5);
      pointer-events: none;
    }

    /* Carta (contenido compartido: tipografía y cuerpo) */
    .letter {
      margin: 0;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.55) 0%, transparent 14%),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 27px,
          rgba(255, 214, 231, 0.2) 27px,
          rgba(255, 214, 231, 0.2) 28px
        ),
        linear-gradient(135deg, #fffefb 0%, var(--blanco-suave) 45%, #fff5fa 100%);
      border-radius: 18px;
      border: 1px solid rgba(232, 180, 184, 0.45);
      padding: clamp(1.25rem, 4vw, 1.75rem) clamp(1.15rem, 4vw, 1.5rem);
    }

    .letter::-webkit-scrollbar {
      width: 7px;
    }

    .letter::-webkit-scrollbar-track {
      background: rgba(255, 247, 251, 0.5);
      border-radius: 99px;
    }

    .letter::-webkit-scrollbar-thumb {
      background: rgba(232, 180, 184, 0.55);
      border-radius: 99px;
    }

    .letter-title {
      font-family: "Great Vibes", cursive;
      font-size: clamp(1.75rem, 6vw, 2.35rem);
      color: #8b5a6b;
      text-align: center;
      margin: 0 0 0.75rem;
      opacity: 0;
      transform: translateY(8px);
    }

    .letter-title.visible {
      animation: fadeUp 0.9s ease forwards;
    }

    .letter-body {
      font-size: clamp(1.05rem, 3.5vw, 1.2rem);
      line-height: 1.75;
      text-align: center;
      font-style: italic;
      font-weight: 400;
      max-width: 100%;
      overflow-wrap: break-word;
      word-wrap: break-word;
      word-break: break-word;
    }

    .letter-body .char {
      opacity: 0;
      display: inline;
    }

    .letter-body .char.show {
      animation: charIn 0.45s ease forwards;
    }

    @keyframes charIn {
      from { opacity: 0; filter: blur(3px); }
      to { opacity: 1; filter: blur(0); }
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .signature {
      font-family: "Great Vibes", cursive;
      font-size: clamp(1.5rem, 5vw, 2rem);
      text-align: right;
      margin-top: 1.25rem;
      color: #a07082;
      opacity: 0;
    }

    .signature.visible {
      animation: fadeUp 1s ease 0.3s forwards;
    }

    .envelope-assembly {
      position: relative;
      width: min(88vw, 300px);
      height: clamp(200px, 42vw, 220px);
      transform-style: preserve-3d;
      animation: assemblyFloat 6s ease-in-out 1.45s infinite;
    }

    .envelope-assembly.is-settled {
      animation: none;
    }

    @keyframes assemblyFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .bg-shimmer,
      .sparkle,
      .heart,
      .envelope-assembly {
        animation: none !important;
      }

      .envelope-wrap {
        animation: none;
        opacity: 1;
      }

      .letter-modal,
      .letter-modal__panel {
        transition-duration: 0.01ms !important;
      }

      .env-flap {
        transition-duration: 0.35s;
      }

      .letter-body .char.show {
        animation: none;
        opacity: 1;
        filter: none;
      }
    }
  </style>
</head>
<body>
  <div class="bg-shimmer" aria-hidden="true"></div>
  <div class="sparkle-layer" id="sparkles" aria-hidden="true"></div>
  <div class="hearts-layer" id="hearts" aria-hidden="true"></div>

  <p class="hint" id="hint">Toca el sobre para abrirlo</p>

  <main class="stage" id="stage">
    <div class="envelope-assembly" id="envelopeAssembly">
      <div class="envelope-wrap" id="envelope" role="button" tabindex="0" aria-label="Abrir sobre">
        <div class="env-back"></div>
        <div class="env-inner-shadow"></div>
        <div class="env-front"></div>
        <div class="env-lip"></div>
        <div class="env-flap">
          <div class="env-flap-inner"></div>
        </div>
        <div class="seal" aria-hidden="true">💗</div>
      </div>
    </div>
  </main>

  <div
    class="letter-modal"
    id="letterModal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="letterTitle"
    aria-hidden="true"
    hidden
  >
    <div class="letter-modal__backdrop" id="letterModalBackdrop" aria-hidden="true"></div>
    <button type="button" class="letter-modal__close" id="letterModalClose" aria-label="Cerrar carta">
      ×
    </button>
    <div class="letter-modal__panel">
      <article class="letter" id="letter" aria-live="polite">
        <h1 class="letter-title" id="letterTitle">Para ti</h1>
        <div class="letter-body" id="letterBody"></div>
        <p class="signature" id="signature">Con todo mi amor</p>
      </article>
    </div>
  </div>

  <script>
    (function () {
      const MESSAGE =
        "Eres mi nuevo sueño, aquel sueño que quiero que sea para siempre, tu amor es lo más calido de este mundo,"+
        "amor mío quiero casarme contigo, tener nuestros hijos y llorar en las noches de felicidad por todo el esfuerzo que hicimos,"+
        "Eres el amor de mi vida, quiero ser tu esposo, prepararte las sopitas que tanto te gustan, eres tu y solamente tu, nadie como tu.";

      const TYPE_BASE_MS = 900;
      const TYPE_PER_CHAR_MS = 28;

      const sparklesRoot = document.getElementById("sparkles");
      const heartsRoot = document.getElementById("hearts");
      const envelope = document.getElementById("envelope");
      const envelopeAssembly = document.getElementById("envelopeAssembly");
      const letter = document.getElementById("letter");
      const letterBody = document.getElementById("letterBody");
      const letterTitle = document.getElementById("letterTitle");
      const signature = document.getElementById("signature");
      const hint = document.getElementById("hint");
      const letterModal = document.getElementById("letterModal");
      const letterModalBackdrop = document.getElementById("letterModalBackdrop");
      const letterModalClose = document.getElementById("letterModalClose");

      var reduceMotion =
        typeof window.matchMedia === "function" &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      var modalCloseMs = reduceMotion ? 60 : 520;

      for (let i = 0; i < 28; i++) {
        const s = document.createElement("span");
        s.className = "sparkle";
        s.style.left = Math.random() * 100 + "%";
        s.style.top = Math.random() * 100 + "%";
        s.style.animationDelay = Math.random() * 4 + "s";
        s.style.animationDuration = 3 + Math.random() * 4 + "s";
        sparklesRoot.appendChild(s);
      }

      const heartChars = ["♥", "♡", "💕", "✿"];
      for (let i = 0; i < 14; i++) {
        const h = document.createElement("span");
        h.className = "heart";
        h.textContent = heartChars[i % heartChars.length];
        h.style.left = Math.random() * 100 + "%";
        h.style.animationDuration = 18 + Math.random() * 16 + "s";
        h.style.animationDelay = Math.random() * 20 + "s";
        h.style.setProperty("--drift", (Math.random() * 80 - 40) + "px");
        heartsRoot.appendChild(h);
      }

      let opened = false;
      var modalIsOpen = false;
      var letterTypingStarted = false;

      function openLetterModal() {
        if (modalIsOpen) return;
        modalIsOpen = true;
        letterModal.removeAttribute("hidden");
        letterModal.setAttribute("aria-hidden", "false");
        void letterModal.offsetWidth;
        document.body.classList.add("modal-open");
        requestAnimationFrame(function () {
          letterModal.classList.add("is-open");
          letterTitle.classList.add("visible");
          if (!letterTypingStarted) {
            letterTypingStarted = true;
            typewriterReveal();
          }
          try {
            letterModalClose.focus({ preventScroll: true });
          } catch (e) {}
        });
      }

      function closeLetterModal() {
        if (!modalIsOpen) return;
        modalIsOpen = false;
        letterModal.classList.remove("is-open");
        document.body.classList.remove("modal-open");
        setTimeout(function () {
          letterModal.setAttribute("hidden", "");
          letterModal.setAttribute("aria-hidden", "true");
        }, modalCloseMs);
      }

      function splitMessage(text) {
        const frag = document.createDocumentFragment();
        text.split("").forEach(function (ch) {
          const span = document.createElement("span");
          span.className = "char";
          span.textContent = ch;
          frag.appendChild(span);
        });
        return frag;
      }

      function typewriterReveal() {
        const chars = letterBody.querySelectorAll(".char");
        if (reduceMotion) {
          chars.forEach(function (el) {
            el.classList.add("show");
          });
          return;
        }
        chars.forEach(function (el, i) {
          setTimeout(function () {
            el.classList.add("show");
          }, TYPE_BASE_MS + i * TYPE_PER_CHAR_MS);
        });
      }

      function openSequence() {
        if (opened) return;
        opened = true;
        hint.classList.add("hidden");
        envelopeAssembly.classList.add("is-settled");
        envelope.classList.add("is-opening");
        envelope.setAttribute("aria-disabled", "true");

        var t1 = reduceMotion ? 0 : 200;
        var tFill = reduceMotion ? 180 : 620;
        var tModal = reduceMotion ? 280 : 920;

        setTimeout(function () {
          envelope.classList.add("opened");
        }, t1);

        setTimeout(function () {
          letterBody.innerHTML = "";
          letterBody.appendChild(splitMessage(MESSAGE));
        }, tFill);

        setTimeout(function () {
          openLetterModal();
        }, tModal);

        var sigDelay = reduceMotion
          ? tModal + 350
          : tModal + TYPE_BASE_MS + MESSAGE.length * TYPE_PER_CHAR_MS + 900;
        setTimeout(function () {
          signature.classList.add("visible");
        }, sigDelay);
      }

      letterModalBackdrop.addEventListener("click", closeLetterModal);
      letterModalClose.addEventListener("click", function (e) {
        e.stopPropagation();
        closeLetterModal();
      });

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && modalIsOpen) {
          closeLetterModal();
        }
      });

      envelope.addEventListener("click", function () {
        if (!opened) {
          openSequence();
        } else if (!modalIsOpen) {
          openLetterModal();
        }
      });
      envelope.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          if (!opened) {
            openSequence();
          } else if (!modalIsOpen) {
            openLetterModal();
          }
        }
      });
    })();
  </script>
</body>
</html>
