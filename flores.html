<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Ti</title>
    <style>
        /* ── Reset y estilos base ── */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000000;
        }
        canvas { display: block; }

        /* ── Mensaje romántico superpuesto ── */
        .mensaje {
            position: fixed;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 220, 230, 0.92);
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: clamp(1rem, 4vw, 1.8rem);
            font-style: italic;
            text-align: center;
            opacity: 0;
            animation: fadeIn 3s ease-in 3s forwards;
            text-shadow: 0 0 25px rgba(255, 100, 150, 0.45),
                         0 0 50px rgba(255, 80, 120, 0.15);
            letter-spacing: 0.06em;
            pointer-events: none;
            width: 90%;
            user-select: none;
        }
        @keyframes fadeIn { to { opacity: 1; } }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <div class="mensaje" id="mensaje"></div>

    <script>
    /* ─────────────────────────────────────────────
     *  Mensajes románticos aleatorios
     *  Cada recarga muestra uno distinto.
     * ───────────────────────────────────────────── */
    (function () {
        var mensajes = [
            'Nunca dejes de ser tu 💕',
            'Estas flores son para la mujer más hermosa 🌸',
            'Para la persona que ilumina mis días ✨',
            'Recuerda que te amo mucho mi peque hermosa',
            'Siempre estás en mi mente y en mi corazón',
            'Eres lo más bonito de mi vida 💗',
            'Cada pétalo que ves es un te adoro ',
            'Gerberas por tú forma tan verdadera 🌺',
            'Para ti, para mi dulce amada 💐',
            'Las flores más lindas para la persona más linda 🌼',
            'Te amo mucho muchote mi Salito hermosa🌼',
            'Gracias por hacerme el hombre más feliz del mundo',
            'Eres mi persona favorita',
            'Eres imperfectamente perfecta',
            'Eres mi motor',
            'Eres mi inspiración',
            'Eres mi motivación',
            'Eres mi todo',
            'Eres mi vida',
            'Eres mi amor',
            'Eres mi vida'
        ];
        var idx = Math.floor(Math.random() * mensajes.length);
        document.getElementById('mensaje').textContent = mensajes[idx];
    })();
    </script>

    <script>
    /* ==========================================================================
     *  Ramo de Gerberas — Página Romántica (v2 mejorada)
     *  Generado 100 % con código (HTML Canvas API).
     *  Sin imágenes externas, sin SVG importados, sin librerías.
     *
     *  Mejoras v2:
     *    - Pétalos redondeados tipo gerbera real (forma de espátula/ovalada)
     *    - 13 gerberas para un ramo más abundante
     *    - Papel de ramo envolviendo los tallos
     *    - Composición más natural y realista
     * ========================================================================== */
    (function () {
        'use strict';

        /* ─────────────────────────────────────────────
         *  1. CONFIGURACIÓN DEL CANVAS
         * ───────────────────────────────────────────── */
        var canvas = document.getElementById('c');
        var ctx    = canvas.getContext('2d');
        var W, H, S, CX, CY;
        var DPR = window.devicePixelRatio || 1;

        /** Ajusta el canvas al tamaño del viewport (soporte Retina / HiDPI) */
        function resize() {
            W  = window.innerWidth;
            H  = window.innerHeight;
            S  = Math.min(Math.min(W, H) / 700, 1.6);
            CX = W / 2;
            CY = H / 2;
            canvas.width  = W * DPR;
            canvas.height = H * DPR;
            canvas.style.width  = W + 'px';
            canvas.style.height = H + 'px';
            ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        }
        window.addEventListener('resize', resize);
        resize();

        /* ─────────────────────────────────────────────
         *  2. UTILIDADES DE COLOR
         * ───────────────────────────────────────────── */

        /** Aclara (+) u oscurece (–) un color HEX sumando `amt` a cada canal */
        function adj(hex, amt) {
            var cl = function (v) { return Math.min(255, Math.max(0, v)); };
            var r = cl(parseInt(hex.slice(1, 3), 16) + amt);
            var g = cl(parseInt(hex.slice(3, 5), 16) + amt);
            var b = cl(parseInt(hex.slice(5, 7), 16) + amt);
            return '#' + [r, g, b].map(function (v) {
                return v.toString(16).padStart(2, '0');
            }).join('');
        }

        /** Convierte HEX a "r,g,b" (string para usar en rgba()) */
        function hexRgb(hex) {
            return parseInt(hex.slice(1, 3), 16) + ',' +
                   parseInt(hex.slice(3, 5), 16) + ',' +
                   parseInt(hex.slice(5, 7), 16);
        }

        /** Interpola linealmente entre dos valores */
        function lerp(a, b, t) { return a + (b - a) * t; }

        /* ─────────────────────────────────────────────
         *  3. DEFINICIÓN DEL RAMO (13 gerberas)
         *
         *  dx, dy    → posición relativa al centro (× S)
         *  size      → radio base de los pétalos
         *  colors    → [capa exterior, intermedia, interior]
         *  delay     → retardo de florecimiento (segundos)
         *  petals    → [# ext, # med, # int]
         *  rot       → desplazamiento angular inicial
         *  zOrder    → orden de profundidad (mayor = más al frente)
         * ───────────────────────────────────────────── */
        var DEFS = [
            /* ── Fila trasera (flores más altas / fondo) ── */
            { dx:    0, dy:-220, size:58, colors:['#FF6B8A','#E84570','#C92B55'], delay:0.3,  petals:[24,18,12], rot:0,    z:1  },
            { dx: -105, dy:-195, size:50, colors:['#FF8C69','#E86B45','#CC5030'], delay:0.6,  petals:[22,16,11], rot:0.35, z:1  },
            { dx:  100, dy:-200, size:52, colors:['#FF9FB0','#E87B90','#D05A70'], delay:0.5,  petals:[22,16,11], rot:0.18, z:1  },
            { dx: -168, dy:-160, size:40, colors:['#FFA07A','#E87D58','#CC6040'], delay:1.2,  petals:[20,14,10], rot:0.9,  z:0  },
            { dx:  158, dy:-165, size:42, colors:['#FFAB91','#E88C70','#CC7055'], delay:1.1,  petals:[20,14,10], rot:0.25, z:0  },

            /* ── Fila media ── */
            { dx:  -55, dy:-155, size:54, colors:['#FFB6C1','#E895A2','#D07585'], delay:0.8,  petals:[24,18,12], rot:0.55, z:2  },
            { dx:   60, dy:-160, size:56, colors:['#FF5252','#E03535','#C01E1E'], delay:0.7,  petals:[24,18,12], rot:0.7,  z:2  },
            { dx: -130, dy:-130, size:44, colors:['#FF7EB3','#E0608A','#C84672'], delay:1.4,  petals:[22,16,11], rot:1.0,  z:2  },
            { dx:  125, dy:-135, size:46, colors:['#FF6F61','#E05045','#CC3830'], delay:1.3,  petals:[22,16,11], rot:0.42, z:2  },

            /* ── Fila frontal (más cercanas, más grandes) ── */
            { dx:    5, dy:-120, size:60, colors:['#FF8FAB','#E06888','#CC4E6E'], delay:1.0,  petals:[26,20,14], rot:0.12, z:3  },
            { dx:  -68, dy:-100, size:48, colors:['#FFB2C1','#E8909F','#D07080'], delay:1.6,  petals:[22,16,11], rot:0.78, z:3  },
            { dx:   72, dy:-105, size:50, colors:['#FF6B6B','#E04A4A','#C83232'], delay:1.5,  petals:[22,16,11], rot:0.3,  z:3  },
            { dx:    0, dy: -78, size:42, colors:['#FF9A9E','#E87880','#D05A62'], delay:1.8,  petals:[20,14,10], rot:0.62, z:4  }
        ];

        /** Estado dinámico por flor */
        var flowers = DEFS.map(function (d) {
            return {
                dx: d.dx, dy: d.dy, size: d.size,
                colors: d.colors, delay: d.delay,
                petals: d.petals, rot: d.rot, z: d.z,
                bloom: 0,
                phase: Math.random() * Math.PI * 2,
                speed: 0.55 + Math.random() * 0.45
            };
        });

        /* ─────────────────────────────────────────────
         *  4. PARTÍCULAS (destellos románticos)
         * ───────────────────────────────────────────── */
        var parts = [];
        var MAX_P = 40;

        function spawnPart() {
            if (parts.length >= MAX_P) return;
            var a = Math.random() * Math.PI * 2;
            var d = Math.random() * 220 * S;
            parts.push({
                x: CX + Math.cos(a) * d,
                y: CY - 120 * S + Math.sin(a) * d * 0.6,
                vx: (Math.random() - 0.5) * 0.22,
                vy: -Math.random() * 0.5 - 0.1,
                life: 1,
                dec: 0.002 + Math.random() * 0.004,
                sz: (0.6 + Math.random() * 1.5) * S,
                hue: [45, 350, 25, 10, 330][Math.floor(Math.random() * 5)]
            });
        }

        /* ─────────────────────────────────────────────
         *  5. FUNCIONES DE DIBUJO
         * ───────────────────────────────────────────── */

        /**
         * Dibuja un pétalo redondeado de gerbera.
         * Forma de espátula/lengüeta ovalada: estrecho en la base,
         * se ensancha en el tercio medio y termina redondeado.
         *
         * @param {number} len   – largo del pétalo
         * @param {number} w     – ancho máximo del pétalo
         * @param {string} base  – color en la base (HEX)
         * @param {string} tip   – color en la punta (HEX)
         */
        function drawPetal(len, w, base, tip) {
            ctx.beginPath();
            ctx.moveTo(0, 0);

            /* ── Lado derecho: base estrecha → ensancha → punta redondeada ── */
            /* Segmento 1: base estrecha a zona ancha */
            ctx.bezierCurveTo(
                w * 0.15, -len * 0.05,     // control 1: apenas se abre
                w * 0.65, -len * 0.25,     // control 2: se ensancha
                w * 0.60, -len * 0.50      // punto medio: ancho máximo
            );
            /* Segmento 2: zona ancha a punta redondeada */
            ctx.bezierCurveTo(
                w * 0.58, -len * 0.72,     // control 1: mantiene ancho
                w * 0.35, -len * 0.95,     // control 2: empieza a cerrar
                0,        -len             // punta (centro)
            );

            /* ── Lado izquierdo (simétrico): punta → base ── */
            ctx.bezierCurveTo(
                -w * 0.35, -len * 0.95,
                -w * 0.58, -len * 0.72,
                -w * 0.60, -len * 0.50
            );
            ctx.bezierCurveTo(
                -w * 0.65, -len * 0.25,
                -w * 0.15, -len * 0.05,
                 0,         0
            );
            ctx.closePath();

            /* Gradiente longitudinal para profundidad */
            var g = ctx.createLinearGradient(0, 0, 0, -len);
            g.addColorStop(0,    adj(base, -30));
            g.addColorStop(0.20, base);
            g.addColorStop(0.55, tip);
            g.addColorStop(0.85, adj(tip, 22));
            g.addColorStop(1,    adj(tip, 35));
            ctx.fillStyle = g;
            ctx.fill();

            /* Línea media sutil (nervadura del pétalo) */
            ctx.beginPath();
            ctx.moveTo(0, -len * 0.08);
            ctx.quadraticCurveTo(0, -len * 0.5, 0, -len * 0.88);
            ctx.strokeStyle = adj(base, -18);
            ctx.lineWidth   = Math.max(0.3, 0.35 * S);
            ctx.globalAlpha = ctx.globalAlpha * 0.25;
            ctx.stroke();
            ctx.globalAlpha = ctx.globalAlpha / 0.25;

            /* Borde sutil del pétalo */
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(w*0.15,-len*0.05, w*0.65,-len*0.25, w*0.60,-len*0.50);
            ctx.bezierCurveTo(w*0.58,-len*0.72, w*0.35,-len*0.95, 0,-len);
            ctx.bezierCurveTo(-w*0.35,-len*0.95, -w*0.58,-len*0.72, -w*0.60,-len*0.50);
            ctx.bezierCurveTo(-w*0.65,-len*0.25, -w*0.15,-len*0.05, 0, 0);
            ctx.closePath();
            ctx.strokeStyle = adj(base, -25);
            ctx.lineWidth   = Math.max(0.2, 0.3 * S);
            ctx.globalAlpha = ctx.globalAlpha * 0.35;
            ctx.stroke();
            ctx.globalAlpha = ctx.globalAlpha / 0.35;
        }

        /**
         * Dibuja el centro (disco de flósculos) de la gerbera.
         */
        function drawCenter(r, t) {
            /* Sombra interior para profundidad */
            ctx.beginPath();
            ctx.arc(0, 0, r * 1.15, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(30,10,0,0.35)';
            ctx.fill();

            /* Disco base con gradiente */
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            var dg = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
            dg.addColorStop(0,   '#8A5520');
            dg.addColorStop(0.35,'#6B3A10');
            dg.addColorStop(0.7, '#5C2E0A');
            dg.addColorStop(1,   '#3D1C02');
            ctx.fillStyle = dg;
            ctx.fill();

            /* Flósculos (puntos en anillos concéntricos) */
            for (var ring = 0; ring < 4; ring++) {
                var rr = r * (0.15 + ring * 0.2);
                var n  = 5 + ring * 4;
                for (var i = 0; i < n; i++) {
                    var a = (i / n) * Math.PI * 2 + ring * 0.6;
                    var fr = r * (0.04 + ring * 0.008);
                    ctx.beginPath();
                    ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr, fr, 0, Math.PI * 2);
                    var colors = ['#A07830', '#8B5A2B', '#7A4E20', '#6B4218'];
                    ctx.fillStyle = colors[ring];
                    ctx.fill();
                }
            }

            /* Brillo / pulso cálido */
            var pulse = 0.14 + 0.10 * Math.sin(t * 2.2);
            var gl = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 2.5);
            gl.addColorStop(0,   'rgba(255,220,140,' + pulse + ')');
            gl.addColorStop(0.3, 'rgba(255,190,100,' + (pulse * 0.4) + ')');
            gl.addColorStop(1,   'rgba(255,150,50,0)');
            ctx.beginPath();
            ctx.arc(0, 0, r * 2.5, 0, Math.PI * 2);
            ctx.fillStyle = gl;
            ctx.fill();
        }

        /**
         * Dibuja una gerbera completa (3 capas de pétalos redondeados + centro).
         */
        function drawGerbera(f, t) {
            var x  = CX + f.dx * S;
            var y  = CY + f.dy * S;
            var sz = f.size * S;
            var bl = f.bloom;
            if (bl < 0.01) return;

            /* Balanceo general (brisa suave) */
            var sway = Math.sin(t * f.speed + f.phase) * 0.025;

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(sway);
            ctx.scale(bl, bl);
            ctx.globalAlpha = Math.min(1, bl * 2.5);

            /* Halo sutil detrás de la flor */
            var halo = ctx.createRadialGradient(0, 0, sz * 0.2, 0, 0, sz * 1.3);
            halo.addColorStop(0, 'rgba(' + hexRgb(f.colors[0]) + ',0.07)');
            halo.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.beginPath();
            ctx.arc(0, 0, sz * 1.3, 0, Math.PI * 2);
            ctx.fillStyle = halo;
            ctx.fill();

            /* ── Capa 1: pétalos exteriores (más largos, más anchos) ── */
            var L1 = sz * 1.0,  W1 = sz * 0.28;
            for (var i = 0; i < f.petals[0]; i++) {
                var a  = (i / f.petals[0]) * Math.PI * 2 + f.rot;
                var ps = Math.sin(t * 1.1 + i * 0.72 + f.phase) * 0.018;
                var lv = 1 + Math.sin(i * 2.4) * 0.06;
                ctx.save();
                ctx.rotate(a + ps);
                drawPetal(L1 * lv, W1, f.colors[0], adj(f.colors[0], 30));
                ctx.restore();
            }

            /* ── Capa 2: pétalos intermedios ── */
            var L2 = sz * 0.68, W2 = sz * 0.24;
            for (var i = 0; i < f.petals[1]; i++) {
                var a  = (i / f.petals[1]) * Math.PI * 2 + f.rot + 0.14;
                var ps = Math.sin(t * 1.3 + i * 0.55 + f.phase) * 0.012;
                var lv = 1 + Math.cos(i * 2.4) * 0.04;
                ctx.save();
                ctx.rotate(a + ps);
                drawPetal(L2 * lv, W2, f.colors[1], adj(f.colors[1], 24));
                ctx.restore();
            }

            /* ── Capa 3: pétalos interiores (pequeños, redondeados) ── */
            var L3 = sz * 0.42, W3 = sz * 0.20;
            for (var i = 0; i < f.petals[2]; i++) {
                var a  = (i / f.petals[2]) * Math.PI * 2 + f.rot + 0.28;
                var ps = Math.sin(t * 1.5 + i * 0.9 + f.phase) * 0.008;
                ctx.save();
                ctx.rotate(a + ps);
                drawPetal(L3, W3, f.colors[2], adj(f.colors[2], 18));
                ctx.restore();
            }

            /* ── Centro ── */
            drawCenter(sz * 0.18, t);

            ctx.globalAlpha = 1;
            ctx.restore();
        }

        /**
         * Dibuja un tallo curvo desde la flor hasta el punto de amarre.
         */
        function drawStem(f, tx, ty, t) {
            var x   = CX + f.dx * S;
            var y   = CY + f.dy * S + f.size * S * 0.12;
            var sw  = Math.sin(t * f.speed + f.phase) * 3.5 * S;
            var cpx = x + (tx - x) * 0.45 + f.dx * 0.12 * S + sw;
            var cpy = y + (ty - y) * 0.55;

            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.quadraticCurveTo(cpx, cpy, tx, ty);

            var sg = ctx.createLinearGradient(x, y, tx, ty);
            sg.addColorStop(0, '#3E8A2C');
            sg.addColorStop(0.6,'#2A6618');
            sg.addColorStop(1, '#1E4A12');
            ctx.strokeStyle = sg;
            ctx.lineWidth   = Math.max(2, 3 * S);
            ctx.lineCap     = 'round';
            ctx.stroke();
        }

        /**
         * Dibuja una hoja con nervaduras.
         */
        function drawLeaf(lx, ly, angle, size, t) {
            var ls = Math.sin(t * 0.65 + angle * 3.2) * 0.05;
            ctx.save();
            ctx.translate(lx, ly);
            ctx.rotate(angle + ls);

            /* Forma ovalada de hoja */
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo( size * 0.32, -size * 0.28,
                               size * 0.20, -size * 0.80, 0, -size);
            ctx.bezierCurveTo(-size * 0.20, -size * 0.80,
                              -size * 0.32, -size * 0.28, 0, 0);

            var lg = ctx.createLinearGradient(0, 0, 0, -size);
            lg.addColorStop(0,   '#1A4A10');
            lg.addColorStop(0.4, '#2B7018');
            lg.addColorStop(0.8, '#358524');
            lg.addColorStop(1,   '#3A9028');
            ctx.fillStyle = lg;
            ctx.fill();

            /* Borde de hoja */
            ctx.strokeStyle = 'rgba(25,60,15,0.3)';
            ctx.lineWidth   = Math.max(0.3, 0.5 * S);
            ctx.stroke();

            /* Nervadura central */
            ctx.beginPath();
            ctx.moveTo(0, -2 * S);
            ctx.lineTo(0, -size * 0.88);
            ctx.strokeStyle = 'rgba(18,55,10,0.45)';
            ctx.lineWidth   = Math.max(0.5, 0.9 * S);
            ctx.stroke();

            /* Nervaduras laterales */
            for (var i = 1; i <= 4; i++) {
                var ny = -size * (0.15 * i);
                var nl = size * 0.11 * (5 - i) / 4;
                ctx.beginPath();
                ctx.moveTo(0, ny);
                ctx.quadraticCurveTo(nl * 0.5, ny - nl * 0.3, nl, ny - nl * 0.5);
                ctx.moveTo(0, ny);
                ctx.quadraticCurveTo(-nl * 0.5, ny - nl * 0.3, -nl, ny - nl * 0.5);
                ctx.strokeStyle = 'rgba(18,55,10,0.28)';
                ctx.lineWidth   = Math.max(0.2, 0.45 * S);
                ctx.stroke();
            }
            ctx.restore();
        }

        /* ─────────────────────────────────────────────
         *  6. PAPEL DE RAMO (envoltorio rosa)
         *
         *  Forma cónica/triangular con pliegues que
         *  envuelve la parte inferior de los tallos.
         * ───────────────────────────────────────────── */

        /**
         * Dibuja el papel de envoltorio del ramo.
         *
         * @param {number} cx – centro X
         * @param {number} topY – borde superior del papel
         * @param {number} botY – borde inferior del papel
         * @param {number} s – escala
         * @param {number} t – tiempo (para animación sutil)
         */
        function drawWrappingPaper(cx, topY, botY, s, t) {
            var paperH = botY - topY;
            var topW   = 130 * s;    // ancho en la parte superior (abierto)
            var botW   = 28 * s;     // ancho en la parte inferior (estrecho)
            var sw     = Math.sin(t * 0.35) * 2 * s;   // balanceo sutil

            ctx.save();

            /* ── Capa trasera del papel (visible detrás) ── */
            ctx.beginPath();
            ctx.moveTo(cx - topW * 1.12 + sw, topY - 18 * s);
            ctx.quadraticCurveTo(
                cx - topW * 0.75 + sw, topY + paperH * 0.25,
                cx - botW * 0.7, botY
            );
            ctx.lineTo(cx + botW * 0.7, botY);
            ctx.quadraticCurveTo(
                cx + topW * 0.75 - sw, topY + paperH * 0.25,
                cx + topW * 1.12 - sw, topY - 18 * s
            );
            ctx.closePath();

            var pg1 = ctx.createLinearGradient(cx - topW, topY, cx + topW, topY);
            pg1.addColorStop(0,   '#D4899A');
            pg1.addColorStop(0.3, '#E8A5B5');
            pg1.addColorStop(0.5, '#F0B8C8');
            pg1.addColorStop(0.7, '#E8A5B5');
            pg1.addColorStop(1,   '#D4899A');
            ctx.fillStyle = pg1;
            ctx.fill();

            /* Borde superior del papel trasero */
            ctx.strokeStyle = 'rgba(180,100,120,0.4)';
            ctx.lineWidth   = Math.max(0.5, 0.8 * s);
            ctx.stroke();

            /* ── Pliegue izquierdo del papel ── */
            ctx.beginPath();
            ctx.moveTo(cx - topW * 0.85 + sw, topY - 6 * s);
            ctx.quadraticCurveTo(
                cx - topW * 0.55 + sw * 0.5, topY + paperH * 0.35,
                cx - botW * 0.3, botY
            );
            ctx.lineTo(cx - botW * 0.7, botY);
            ctx.quadraticCurveTo(
                cx - topW * 0.70 + sw, topY + paperH * 0.3,
                cx - topW * 1.08 + sw, topY - 14 * s
            );
            ctx.closePath();

            var pg2 = ctx.createLinearGradient(cx - topW * 1.1, topY, cx, botY);
            pg2.addColorStop(0,   '#E0A0B2');
            pg2.addColorStop(0.4, '#F2C0D0');
            pg2.addColorStop(0.7, '#F5C8D5');
            pg2.addColorStop(1,   '#E8B0C0');
            ctx.fillStyle = pg2;
            ctx.fill();
            ctx.strokeStyle = 'rgba(190,110,130,0.25)';
            ctx.lineWidth   = Math.max(0.3, 0.5 * s);
            ctx.stroke();

            /* ── Pliegue derecho del papel ── */
            ctx.beginPath();
            ctx.moveTo(cx + topW * 0.85 - sw, topY - 6 * s);
            ctx.quadraticCurveTo(
                cx + topW * 0.55 - sw * 0.5, topY + paperH * 0.35,
                cx + botW * 0.3, botY
            );
            ctx.lineTo(cx + botW * 0.7, botY);
            ctx.quadraticCurveTo(
                cx + topW * 0.70 - sw, topY + paperH * 0.3,
                cx + topW * 1.08 - sw, topY - 14 * s
            );
            ctx.closePath();

            var pg3 = ctx.createLinearGradient(cx, topY, cx + topW * 1.1, botY);
            pg3.addColorStop(0,   '#E8B0C0');
            pg3.addColorStop(0.3, '#F5C8D5');
            pg3.addColorStop(0.6, '#F2C0D0');
            pg3.addColorStop(1,   '#E0A0B2');
            ctx.fillStyle = pg3;
            ctx.fill();
            ctx.strokeStyle = 'rgba(190,110,130,0.25)';
            ctx.stroke();

            /* ── Panel central frontal del papel ── */
            ctx.beginPath();
            ctx.moveTo(cx - topW * 0.55 + sw * 0.3, topY + 5 * s);
            ctx.quadraticCurveTo(
                cx - topW * 0.30, topY + paperH * 0.38,
                cx - botW * 0.3, botY
            );
            ctx.lineTo(cx + botW * 0.3, botY);
            ctx.quadraticCurveTo(
                cx + topW * 0.30, topY + paperH * 0.38,
                cx + topW * 0.55 - sw * 0.3, topY + 5 * s
            );
            ctx.closePath();

            var pg4 = ctx.createLinearGradient(cx - topW * 0.5, topY, cx + topW * 0.5, botY);
            pg4.addColorStop(0,   '#F0BDC8');
            pg4.addColorStop(0.3, '#F8D5E0');
            pg4.addColorStop(0.5, '#FADDEA');
            pg4.addColorStop(0.7, '#F8D5E0');
            pg4.addColorStop(1,   '#F0BDC8');
            ctx.fillStyle = pg4;
            ctx.fill();

            /* Líneas de pliegue sutiles en el panel central */
            for (var p = 0; p < 3; p++) {
                var px = cx + (p - 1) * topW * 0.18;
                ctx.beginPath();
                ctx.moveTo(px + sw * 0.2, topY + 10 * s);
                ctx.quadraticCurveTo(
                    px + (p - 1) * 3 * s,
                    topY + paperH * 0.5,
                    cx + (p - 1) * botW * 0.08,
                    botY - 5 * s
                );
                ctx.strokeStyle = 'rgba(200,130,150,0.18)';
                ctx.lineWidth   = Math.max(0.3, 0.6 * s);
                ctx.stroke();
            }

            /* ── Brillo sutil en el papel ── */
            var sheen = ctx.createRadialGradient(
                cx, topY + paperH * 0.3, 0,
                cx, topY + paperH * 0.3, topW * 0.6
            );
            sheen.addColorStop(0, 'rgba(255,240,245,0.08)');
            sheen.addColorStop(1, 'rgba(255,220,230,0)');
            ctx.fillStyle = sheen;
            ctx.fillRect(cx - topW * 1.2, topY - 20 * s, topW * 2.4, paperH + 25 * s);

            ctx.restore();
        }

        /**
         * Dibuja el lazo/moño que ata el ramo.
         */
        function drawRibbon(rx, ry, s) {
            ctx.save();
            ctx.translate(rx, ry);

            var bw = 25 * s, bh = 10 * s;

            /* Banda horizontal */
            ctx.beginPath();
            ctx.moveTo(-bw, -bh);
            ctx.quadraticCurveTo(-bw * 1.06, 0, -bw, bh);
            ctx.lineTo(bw, bh);
            ctx.quadraticCurveTo(bw * 1.06, 0, bw, -bh);
            ctx.closePath();
            var bg = ctx.createLinearGradient(-bw, 0, bw, 0);
            bg.addColorStop(0,   '#8B1228');
            bg.addColorStop(0.35,'#C41E3A');
            bg.addColorStop(0.65,'#C41E3A');
            bg.addColorStop(1,   '#8B1228');
            ctx.fillStyle = bg;
            ctx.fill();

            /* Lazo izquierdo */
            ctx.beginPath();
            ctx.moveTo(-2 * s, -1 * s);
            ctx.bezierCurveTo(-28 * s, -24 * s, -38 * s, 10 * s, -2 * s, 2 * s);
            ctx.fillStyle   = '#DC2B4A';
            ctx.fill();
            ctx.strokeStyle = '#A01530';
            ctx.lineWidth   = 0.5 * s;
            ctx.stroke();

            /* Lazo derecho */
            ctx.beginPath();
            ctx.moveTo(2 * s, -1 * s);
            ctx.bezierCurveTo(28 * s, -24 * s, 38 * s, 10 * s, 2 * s, 2 * s);
            ctx.fillStyle   = '#DC2B4A';
            ctx.fill();
            ctx.strokeStyle = '#A01530';
            ctx.stroke();

            /* Colas del lazo */
            ctx.lineWidth   = 2.5 * s;
            ctx.strokeStyle = '#C41E3A';
            ctx.lineCap     = 'round';

            ctx.beginPath();
            ctx.moveTo(-2 * s, bh);
            ctx.quadraticCurveTo(-17 * s, bh + 24 * s, -11 * s, bh + 36 * s);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(2 * s, bh);
            ctx.quadraticCurveTo(17 * s, bh + 24 * s, 11 * s, bh + 36 * s);
            ctx.stroke();

            /* Nudo central */
            ctx.beginPath();
            ctx.ellipse(0, 0, 5 * s, 3.8 * s, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#8B1228';
            ctx.fill();

            ctx.restore();
        }

        /** Posiciones de hojas */
        function leafData() {
            return [
                { x: CX - 55 * S, y: CY - 65 * S, a: -0.85,  sz: 48 * S },
                { x: CX + 50 * S, y: CY - 55 * S, a:  0.78,  sz: 44 * S },
                { x: CX - 35 * S, y: CY - 12 * S, a: -1.15,  sz: 52 * S },
                { x: CX + 38 * S, y: CY - 8 * S,  a:  1.10,  sz: 50 * S },
                { x: CX - 75 * S, y: CY - 100 * S,a: -0.45,  sz: 38 * S },
                { x: CX + 68 * S, y: CY - 92 * S, a:  0.42,  sz: 36 * S },
                { x: CX - 95 * S, y: CY - 80 * S, a: -0.68,  sz: 34 * S },
                { x: CX + 88 * S, y: CY - 75 * S, a:  0.65,  sz: 32 * S }
            ];
        }

        /* ─────────────────────────────────────────────
         *  7. EASING
         * ───────────────────────────────────────────── */
        function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }

        /* ─────────────────────────────────────────────
         *  8. BUCLE PRINCIPAL DE ANIMACIÓN
         * ───────────────────────────────────────────── */
        var t0 = null;
        var spawnTick = 0;

        function frame(ts) {
            if (!t0) t0 = ts;
            var t = (ts - t0) / 1000;

            /* Fondo negro */
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, W, H);

            /* Resplandor ambiental cálido */
            var amb = ctx.createRadialGradient(
                CX, CY - 110 * S, 0,
                CX, CY - 110 * S, 300 * S
            );
            amb.addColorStop(0, 'rgba(55,15,28,' + Math.min(0.24, t * 0.035) + ')');
            amb.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = amb;
            ctx.fillRect(0, 0, W, H);

            /* Actualizar bloom de cada flor */
            flowers.forEach(function (f) {
                var bt = t - f.delay;
                if (bt > 0) f.bloom = Math.min(1, easeOutCubic(Math.min(1, bt / 1.6)));
            });

            /* Posiciones clave */
            var tieX    = CX;
            var tieY    = CY + 20 * S;                              // punto de amarre
            var paperTop = tieY - 18 * S;                            // borde superior del papel
            var paperBot = Math.min(tieY + 195 * S, H * 0.90);      // borde inferior del papel

            var vis = flowers.some(function (f) { return f.bloom > 0.01; });

            /* ═══════════════════════════════════════════
             *  ORDEN DE CAPAS (de atrás hacia adelante)
             * ═══════════════════════════════════════════ */

            /* 1. Tallos (detrás de todo) */
            flowers.forEach(function (f) {
                if (f.bloom > 0.01) {
                    ctx.globalAlpha = Math.min(1, f.bloom * 3);
                    drawStem(f, tieX, tieY, t);
                }
            });
            ctx.globalAlpha = 1;

            /* 2. Papel de ramo (envuelve los tallos) */
            if (vis) {
                var pa = Math.min(1, Math.max(0, (t - 0.2) / 1.8));
                if (pa > 0) {
                    ctx.globalAlpha = pa;
                    drawWrappingPaper(tieX, paperTop, paperBot, S, t);
                    ctx.globalAlpha = 1;
                }
            }

            /* 3. Hojas (sobresalen entre los tallos y el papel) */
            if (vis) {
                var la = Math.min(1, Math.max(0, (t - 0.5) / 2.0));
                if (la > 0) {
                    ctx.globalAlpha = la;
                    leafData().forEach(function (l) {
                        drawLeaf(l.x, l.y, l.a, l.sz, t);
                    });
                    ctx.globalAlpha = 1;
                }
            }

            /* 4. Lazo / moño (encima del papel) */
            if (vis) {
                var ra = Math.min(1, Math.max(0, (t - 0.6) / 1.4));
                if (ra > 0) {
                    ctx.globalAlpha = ra;
                    drawRibbon(tieX, tieY + 2 * S, S);
                    ctx.globalAlpha = 1;
                }
            }

            /* 5. Flores (ordenadas por z luego por dy) */
            flowers.slice()
                .sort(function (a, b) {
                    if (a.z !== b.z) return a.z - b.z;
                    return a.dy - b.dy;
                })
                .forEach(function (f) { drawGerbera(f, t); });

            /* 6. Partículas / destellos */
            if (t > 2.5) {
                spawnTick++;
                if (spawnTick % 6 === 0) spawnPart();
            }
            for (var i = parts.length - 1; i >= 0; i--) {
                var p = parts[i];
                p.x    += p.vx;
                p.y    += p.vy;
                p.life -= p.dec;
                if (p.life <= 0) { parts.splice(i, 1); continue; }
                ctx.globalAlpha = p.life * 0.6;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.sz, 0, Math.PI * 2);
                ctx.fillStyle = 'hsla(' + p.hue + ',80%,82%,1)';
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            /* 7. Viñeta sutil */
            var vig = ctx.createRadialGradient(
                CX, CY - 50 * S, Math.min(W, H) * 0.30,
                CX, CY,          Math.max(W, H) * 0.80
            );
            vig.addColorStop(0, 'rgba(0,0,0,0)');
            vig.addColorStop(1, 'rgba(0,0,0,0.30)');
            ctx.fillStyle = vig;
            ctx.fillRect(0, 0, W, H);

            requestAnimationFrame(frame);
        }

        /* ── ¡Inicio! ── */
        requestAnimationFrame(frame);
    })();
    </script>
</body>
</html>
